# AssettoServer extra configuration
# Gerado automaticamente - edite conforme necessário

# Porta HTTP do servidor (deve coincidir com HTTP_PORT no server_cfg.ini)
Server:
  HttpPort: 8081

# AI Traffic (requer fast_lane.ai na pasta da pista)
EnableAi: false

# Steam Auth (recomendado - requer CSP 0.1.75+)
UseSteamAuth: false

# Versão mínima do CSP (0 = desativado)
MinimumCSPVersion: 0

# Ignorar erros de checksums de carros ausentes (útil para carros mod)
IgnoreConfigurationErrors:
  MissingCarChecksums: true
  MissingTrackParams: true
